<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6fb"><title>RinPerintis Shop</title>
<style>
:root{--blue:#4168df;--ink:#182235;--muted:#778091;--bg:#f3f5fa;--line:#e5e9f0;--soft:#edf1ff;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.top{max-width:1100px;margin:auto;padding:22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:25px;letter-spacing:-.7px}.actions{display:flex;align-items:center;gap:12px}.btn{padding:13px 19px;border-radius:15px;background:var(--blue);color:white;font-weight:700;box-shadow:0 10px 25px #4168df22}.btn.secondary{background:var(--soft);color:var(--ink);box-shadow:none}.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}.btn.danger{background:#fae8e8;color:#b93e3e;box-shadow:none}.wrap{max-width:1100px;margin:18px auto 100px;padding:0 20px}.hero{min-height:300px;border-radius:30px;padding:35px;display:flex;flex-direction:column;justify-content:end;color:white;background:linear-gradient(90deg,#101827e8,#10182740),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=80') center/cover;overflow:hidden}.pill{display:inline-block;background:#eef2ff;color:#4a6bd1;border-radius:16px;padding:10px 16px;font-weight:700;width:max-content}.hero .pill{background:#ffffff28;color:white}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08;max-width:720px;margin:18px 0 12px;letter-spacing:-1.5px}.hero p{font-size:19px;color:#e1e6ef;margin:0}.card{background:white;border:1px solid var(--line);border-radius:30px;padding:28px;margin-top:22px;box-shadow:0 15px 40px #202d4410}.card h2{font-size:30px;letter-spacing:-.8px;margin:10px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stat{border:1px solid var(--line);border-radius:23px;padding:22px;background:white}.stat strong{display:block;font-size:30px;margin-top:8px}.field{display:grid;gap:7px;margin:15px 0;font-weight:650}.field input,.field select{width:100%;padding:16px;border:1px solid var(--line);border-radius:18px;background:white;outline:none;color:var(--ink)}.field input:focus,.field select:focus{border-color:var(--blue)}.full{width:100%;padding:16px}.auth{max-width:650px;margin:120px auto 40px}.auth .card{padding:34px}.auth h1{font-size:36px;letter-spacing:-1px;margin:12px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px max(12px,calc((100% - 800px)/2));backdrop-filter:blur(15px);z-index:5}.nav button{flex:1;max-width:180px;padding:10px 4px;border-radius:17px;background:transparent;color:#8a93a4;font-weight:650}.nav button.active{background:var(--soft);color:var(--blue)}.nav span{display:block;font-size:13px}.range{width:100%;accent-color:var(--blue)}.price{background:var(--soft);padding:20px;border-radius:22px;margin:18px 0}.price strong{font-size:28px;display:block}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#182235;color:white;padding:12px 18px;border-radius:15px;z-index:10;max-width:90%;box-shadow:0 10px 35px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tableitem{border-bottom:1px solid var(--line);padding:15px 0}.notice{font-size:13px;background:#fff8df;border-radius:15px;padding:13px;color:#785e12;margin-top:14px}a{color:var(--blue)}@media(max-width:650px){.top{padding:18px 16px}.brand{font-size:22px}.wrap{padding:0 14px;margin-top:8px}.hero{padding:24px;min-height:270px;border-radius:25px}.card{padding:22px;border-radius:25px}.grid{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.stat strong{font-size:24px}.auth{margin:75px 14px 40px}.auth .card{padding:24px}.card h2{font-size:26px}.actions{gap:3px}.actions .btn{padding:11px 13px}}
</style></head><body>
<div id="toast" class="toast hidden"></div>
<header class="top"><div class="brand">RinPerintis</div><div class="actions"><button id="headerLogin" class="btn ghost" onclick="showAuth('login')">Login</button><button id="headerRegister" class="btn" onclick="showAuth('register')">Register</button><button id="logoutTop" class="btn danger hidden" onclick="logout()">Logout</button></div></header>
<main id="app"></main><nav id="nav" class="nav hidden"><button data-page="dashboard" onclick="go('dashboard')">▦<span>Dashboard</span></button><button data-page="catalog" onclick="go('catalog')">◇<span>Catalog</span></button><button data-page="billing" onclick="go('billing')">▤<span>Billing</span></button><button data-page="profile" onclick="go('profile')">♙<span>Profile</span></button></nav>
<script>
const $=s=>document.querySelector(s), rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
let currentUser=localStorage.getItem('rp_user')||'',page='home',ram=1,disk=10,cpu=50,egg='Minecraft - Vanilla Minecraft',coinAmount=100;
const readUsers=()=>JSON.parse(localStorage.getItem('rp_users')||'{}');
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function showAuth(mode){page=mode;render()}
function go(p){page=p;render()}
function logout(){currentUser='';localStorage.removeItem('rp_user');page='home';render();toast('Kamu sudah logout.')}
function render(){const app=$('#app');$('#nav').classList.toggle('hidden',!currentUser);$('#headerLogin').classList.toggle('hidden',!!currentUser);$('#headerRegister').classList.toggle('hidden',!!currentUser);$('#logoutTop').classList.toggle('hidden',!currentUser);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(!currentUser&&['dashboard','catalog','billing','profile'].includes(page))page='home';
if(page==='login'||page==='register'){app.innerHTML=`<div class="auth"><section class="card"><button class="btn ghost" onclick="go('home')">← Home</button><div class="pill" style="margin-top:18px">${page==='login'?'↪ Login':'♙ Register'}</div><h1>${page==='login'?'Welcome back':'Create account'}</h1><p class="muted">${page==='login'?'Login ke RinPerintis Shop.':'Username minimal 5 karakter. Password minimal 8 karakter dan 1 simbol.'}</p><form onsubmit="auth(event,'${page}')"><label class="field">Username<input id="username" required minlength="5" autocomplete="username"></label><label class="field">Password<input id="password" type="password" required minlength="8" autocomplete="${page==='login'?'current-password':'new-password'}"></label>${page==='register'?'<p class="muted">Gunakan minimal 8 karakter dan setidaknya 1 simbol.</p>':''}<button class="btn full" type="submit">${page==='login'?'↪ Login':'♙ Register'}</button></form><p class="muted">${page==='login'?'Belum punya akun?':'Sudah punya akun?'} <a href="#" onclick="showAuth('${page==='login'?'register':'login'}');return false">${page==='login'?'Register':'Login'}</a></p><div class="notice">Demo awal menyimpan akun hanya di browser ini. Untuk website publik, gunakan backend dan database agar akun aman dan bisa dipakai lintas perangkat.</div></section></div>`;return}
if(page==='home'){app.innerHTML=`<div class="wrap"><section class="hero"><span class="pill">RINPERINTIS SHOP</span><h1>Panel sesuai kebutuhanmu.</h1><p>Atur RAM, Disk, CPU, dan pilihan server dengan mudah.</p></section><section class="card"><span class="pill">CUSTOM RESOURCE PANEL</span><h2>Bayar sesuai resource.</h2><p class="muted">Atur resource sesuai kebutuhan sebelum membeli panel.</p><button class="btn full" onclick="showAuth('login')">→ Mulai sekarang</button></section><section class="card"><p class="muted">BANTUAN</p><h2>FAQ</h2><details class="tableitem"><summary>Bagaimana sistem harga?</summary><p class="muted">Harga perkiraan ditentukan dari RAM, Disk, CPU dan durasi yang dipilih.</p></details><details class="tableitem"><summary>Bagaimana pembayaran?</summary><p class="muted">Pembayaran gateway perlu dikonfigurasi di backend sebelum transaksi live.</p></details></section></div>`;return}
if(page==='dashboard'){app.innerHTML=`<div class="wrap"><p class="muted">RINPERINTIS SHOP</p><h1>Dashboard</h1><section class="hero"><span class="pill">RINPERINTIS SHOP</span><h1>Panel dengan resource sesuai kebutuhanmu.</h1><p>Customize RAM, Disk, CPU dan Egg.</p></section><div class="grid" style="margin-top:18px"><div class="stat"><span class="muted">ACCOUNT</span><strong>${escapeHtml(currentUser)}</strong></div><div class="stat"><span class="muted">WALLET</span><strong>${getCoins()} coins</strong></div><div class="stat"><span class="muted">ORDER SUCCESS</span><strong>${getOrders().filter(o=>o.status==='paid').length}</strong></div><div class="stat"><span class="muted">SERVER STATUS</span><strong style="font-size:23px">READY</strong></div></div><section class="card"><p class="muted">SERVER STATUS</p><div class="row"><b>Store API</b><b>Demo mode</b></div><p class="muted">Hubungkan API payment gateway melalui backend sebelum menerima pembayaran sungguhan.</p><button class="btn full" onclick="go('catalog')">◇ Quick Catalog</button></section></div>`;return}
if(page==='catalog'){app.innerHTML=`<div class="wrap"><p class="muted">RINPERINTIS SHOP</p><h1>Catalog</h1><section class="card"><p class="muted">CUSTOM PANEL</p><h2>Build your resource</h2><p class="muted">RAM Rp1.000 per 500MB, Disk Rp1.000 per GB, CPU Rp800 per 10% per bulan.</p><label class="field">RAM <b id="ramLabel">${ram} GB</b><input class="range" type="range" min="1" max="16" step="1" value="${ram}" oninput="ram=+this.value;updateCatalog()"></label><label class="field">Disk <b id="diskLabel">${disk} GB</b><input class="range" type="range" min="5" max="100" step="5" value="${disk}" oninput="disk=+this.value;updateCatalog()"></label><label class="field">CPU <b id="cpuLabel">${cpu}%</b><input class="range" type="range" min="10" max="100" step="10" value="${cpu}" oninput="cpu=+this.value;updateCatalog()"></label><label class="field">Egg<select id="egg" onchange="egg=this.value;updateCatalog()"><option>Minecraft - Vanilla Minecraft</option><option>Node.js</option><option>Python</option><option>Generic - Java</option></select></label><label class="field">Durasi<select id="duration" onchange="updateCatalog()"><option value="1">1 hari</option><option value="2">2 hari</option><option value="7">7 hari</option><option value="14">14 hari</option><option value="30" selected>30 hari</option></select></label><div class="price"><span class="muted">ESTIMASI HARGA</span><strong id="price">${rupiah(price())}</strong><span class="muted">Harga demo, bisa diubah di kode.</span></div><button class="btn full" onclick="buyPanel()">🛒 Buy Panel</button><div class="notice">Tombol ini belum memotong uang atau membuat server sungguhan. Integrasi API gateway dan Pterodactyl harus dipasang di backend.</div></section></div>`;return}
if(page==='billing'){app.innerHTML=`<div class="wrap"><p class="muted">RINPERINTIS SHOP</p><h1>Billing</h1><section class="card"><p class="muted">WALLET</p><h2>${getCoins()} coins</h2><p class="muted">100 coins setara Rp10.000.</p><label class="field">Coins<input id="coins" type="number" min="100" step="100" value="${coinAmount}" oninput="coinAmount=Math.max(100,+this.value||100);$('#total').textContent=rupiah(coinAmount*100)"></label><p class="muted">Total pembayaran: <b id="total">${rupiah(coinAmount*100)}</b></p><button class="btn full" onclick="topup()">▦ Top Up</button><div class="notice">Pembayaran belum aktif sampai endpoint API dan secret key dipasang di backend.</div></section><section class="card"><h2>Riwayat Top Up</h2>${getOrders().filter(o=>o.type==='topup').map(orderHtml).join('')||'<p class="muted">Belum ada transaksi.</p>'}</section><section class="card"><h2>Riwayat Pesanan</h2>${getOrders().filter(o=>o.type==='panel').map(orderHtml).join('')||'<p class="muted">Belum ada pesanan.</p>'}</section></div>`;return}
if(page==='profile'){app.innerHTML=`<div class="wrap"><p class="muted">RINPERINTIS SHOP</p><h1>Profile</h1><section class="card"><div class="pill">♙</div><p class="muted">ACCOUNT</p><h2>${escapeHtml(currentUser)}</h2><h2>${getCoins()} coins</h2><p class="muted">Akun RinPerintis Shop.</p><button class="btn full" onclick="go('billing')">▤ Top Up</button><button class="btn secondary full" style="margin-top:12px" onclick="renew()">↗ Perpanjangan Server</button><button class="btn danger full" style="margin-top:55px" onclick="logout()">⇥ Logout</button></section><section class="card"><h2>Keamanan Akun</h2><p class="muted">Jangan membagikan password kepada siapa pun. Gunakan backend dengan autentikasi dan database untuk produksi.</p></section></div>`;return}
}
function auth(e,mode){e.preventDefault();const u=$('#username').value.trim(),p=$('#password').value,users=readUsers();if(mode==='register'){if(u.length<5||p.length<8||!/[!@#$%^&*(),.?":{}|<>_\-]/.test(p)){toast('Username min. 5 karakter; password min. 8 karakter dan 1 simbol.');return}if(users[u]){toast('Username sudah digunakan.');return}users[u]={password:p,coins:0,orders:[]};localStorage.setItem('rp_users',JSON.stringify(users));}else if(!users[u]||users[u].password!==p){toast('Username atau password salah.');return}currentUser=u;localStorage.setItem('rp_user',u);page='dashboard';render();toast(mode==='register'?'Registrasi berhasil.':'Login berhasil.')}
function userData(){let u=readUsers();if(!u[currentUser])u[currentUser]={coins:0,orders:[]};return [u,u[currentUser]]}function saveData(u){localStorage.setItem('rp_users',JSON.stringify(u))}function getCoins(){return userData()[1].coins||0}function getOrders(){return userData()[1].orders||[]}function price(){let monthly=ram*2000+disk*1000+(cpu/10)*800;return Math.max(1000,Math.ceil(monthly*Number($('#duration')?.value||30)/30))}function updateCatalog(){if($('#ramLabel'))$('#ramLabel').textContent=ram+' GB';if($('#diskLabel'))$('#diskLabel').textContent=disk+' GB';if($('#cpuLabel'))$('#cpuLabel').textContent=cpu+'%';if($('#price'))$('#price').textContent=rupiah(price())}
function addOrder(o){let [all,u]=userData();u.orders.unshift({...o,date:new Date().toLocaleString('id-ID')});all[currentUser]=u;saveData(all)}
async function createPayment(payload){const res=await fetch('/api/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Payment API belum siap');return data}
async function topup(){try{const amount=coinAmount*100,orderId='RP-'+Date.now();const result=await createPayment({type:'topup',amount,orderId,username:currentUser,coins:coinAmount});addOrder({type:'topup',amount,coins:coinAmount,status:'pending',orderId});render();if(result.paymentUrl)location.href=result.paymentUrl;else toast('Invoice dibuat. Ikuti instruksi pembayaran dari gateway.')}catch(e){toast(e.message+' — cek konfigurasi backend.');}}
async function buyPanel(){try{const days=Number($('#duration').value),amount=price(),orderId='RP-'+Date.now();const result=await createPayment({type:'panel',amount,orderId,username:currentUser,days,ram,disk,cpu,egg});addOrder({type:'panel',amount,status:'pending',orderId,days,ram,disk,cpu,egg});render();if(result.paymentUrl)location.href=result.paymentUrl;else toast('Pesanan tercatat sebagai pending.')}catch(e){toast(e.message+' — cek konfigurasi backend.');}}
function renew(){go('catalog');toast('Pilih resource dan durasi untuk mengajukan perpanjangan.')}
function orderHtml(o){return `<div class="tableitem"><div class="row"><b>${o.type==='topup'?'Top Up':'Panel'} · ${escapeHtml(o.orderId||'')}</b><b>${rupiah(o.amount||0)}</b></div><p class="muted">${escapeHtml(o.status||'pending')} · ${escapeHtml(o.date||'')}</p></div>`}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></body></html>
